server {
    listen 80;
    listen [::]:80;
    server_name cabsarathi.in www.cabsarathi.in;

    root /var/www/cabsarathi;
    index index.html;

    if ($host = www.cabsarathi.in) {
        return 301 https://cabsarathi.in$request_uri;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }
    location = /README.md { deny all; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(css|js|svg|webp|png|jpg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
